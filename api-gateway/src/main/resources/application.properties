spring.application.name=api-gateway
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=https://logitrack-auth-service.onrender.com
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=shipment-service
spring.cloud.gateway.server.webflux.routes[1].uri=https://logitrack-shipment-service.onrender.com
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/shipments/**

spring.cloud.gateway.server.webflux.routes[2].id=notification-service
spring.cloud.gateway.server.webflux.routes[2].uri=https://logitrack-notification-service.onrender.com
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/notifications/**